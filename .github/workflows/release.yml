name: Auto Release

# 发布流程（全自动，合并进 main 即发布）：
#   1. main 上脚本/模板有改动 → 自动把 xy-installer.py 里的 SCRIPT_VERSION 补丁位 +1 并回写提交
#   2. 打 vX.Y.Z 标签 → 创建 GitHub Release（自动生成更新说明）
#   想升大/中版本：合并前手动把 SCRIPT_VERSION 改成更高的号（如 2.0.0），CI 检测到比已发布的高
#   就直接用它发布，不再自动 +1。
# 注意：CI 的回写提交用 GITHUB_TOKEN push，GitHub 不会再触发工作流，不存在死循环。

on:
  push:
    branches: [main]
    paths:
      - 'xy-installer.py'
      - 'net-optimize.py'
      - 'cn-block.py'
      - 'adguard-dns.py'
  workflow_dispatch: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史和全部 tag 来算最新已发布版本

      - name: Compute version (auto-bump patch, honor manual bump)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file_ver=$(grep -Po '^SCRIPT_VERSION\s*=\s*"\K[^"]+' xy-installer.py)
          latest_tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          latest_ver=${latest_tag#v}
          echo "file=$file_ver latest_tag=${latest_tag:-none}"

          # 最新的 tag 在、Release 却不在：api.github.com 偶发 5xx 会留下这种半截状态
          # （tag ref 先建好，创建 Release 的那一步才失败）。要把它补完，而不是当成
          # "已发布"再往上涨一个号 —— 否则那个版本永远补不上，而且每失败一次就白扔
          # 一个版本号。这里不回写文件、不重新打 tag，只补建 Release。
          if [ -n "$latest_tag" ] && ! gh release view "$latest_tag" >/dev/null 2>&1; then
            echo "Tag $latest_tag has no release, completing it instead of bumping."
            {
              echo "skip=false"
              echo "new_ver=$latest_ver"
              echo "bump=false"
              echo "file_ver=$file_ver"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$latest_tag" ]; then
            # 第一次发布：直接用文件里的版本号
            new_ver="$file_ver"; bump=false
          elif [ "$file_ver" != "$latest_ver" ] && \
               [ "$(printf '%s\n' "$latest_ver" "$file_ver" | sort -V | tail -1)" = "$file_ver" ]; then
            # 人工把版本号改得比已发布的高 → 尊重人工版本，直接发布
            new_ver="$file_ver"; bump=false
          else
            # 常规情况：补丁位 +1 并回写文件
            IFS=. read -r a b c <<< "$latest_ver"
            new_ver="$a.$b.$((c+1))"; bump=true
          fi
          if git rev-parse -q --verify "refs/tags/v$new_ver" >/dev/null; then
            echo "Tag v$new_ver already exists, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false"        >> "$GITHUB_OUTPUT"
          echo "new_ver=$new_ver"  >> "$GITHUB_OUTPUT"
          echo "bump=$bump"        >> "$GITHUB_OUTPUT"
          echo "file_ver=$file_ver" >> "$GITHUB_OUTPUT"

      - name: Bump SCRIPT_VERSION & push
        id: bump
        if: steps.ver.outputs.skip == 'false' && steps.ver.outputs.bump == 'true'
        run: |
          set -euo pipefail
          new_ver='${{ steps.ver.outputs.new_ver }}'
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 【不能 rebase】：版本号回写改的永远是 SCRIPT_VERSION 那一行，另一个 run 的
          # 回写改的也是同一行 —— rebase 必然冲突，重试多少次都一样。所以每一轮都
          # 站到最新的 main 上【重新打这个补丁】，而不是拿旧提交去 rebase。
          for i in 1 2 3 4 5; do
            git fetch origin main
            git fetch origin --tags --force || true
            git reset --hard origin/main
            # main 就停在最新 tag 上 = 自上次发布以来没有任何新内容。连续合并 PR 时
            # 会冒出多余的 run（同一个提交被跑两遍），不拦下来就会白发一个空版本。
            last_tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            if [ -n "$last_tag" ] && \
               [ "$(git rev-parse "$last_tag^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "main 就停在 $last_tag 上，自上次发布以来没有新内容，本轮跳过。"
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cur=$(grep -Po '^SCRIPT_VERSION\s*=\s*"\K[^"]+' xy-installer.py)
            # 另一个 run 抢先发布了同等或更高的版本（连续合并 PR 时很常见）：
            # 那个版本已经包含了本轮要发的全部内容，这里无事可做，干净退出即可。
            if [ "$cur" = "$new_ver" ] || \
               [ "$(printf '%s\n' "$cur" "$new_ver" | sort -V | tail -1)" = "$cur" ]; then
              echo "main 已是 v$cur（≥ v$new_ver），另一个 run 抢先发过了，本轮跳过。"
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sed -i "s/^SCRIPT_VERSION = \"$cur\"/SCRIPT_VERSION = \"$new_ver\"/" xy-installer.py
            grep -q "^SCRIPT_VERSION = \"$new_ver\"" xy-installer.py
            git add xy-installer.py
            git commit -m "chore(release): v$new_ver"
            if git push origin HEAD:main; then
              echo "Push success."
              echo "superseded=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (race). retry=${i}"; sleep $((i*2))
          done
          echo "Failed to push after retries."; exit 1

      - name: Tag & create GitHub Release
        # superseded：回写那步发现另一个 run 已经发了更高的版本 → 这里也别再打 tag，
        # 否则会给 main 打上一个文件里根本不存在的版本号。
        if: steps.ver.outputs.skip == 'false' && steps.bump.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          new_ver='${{ steps.ver.outputs.new_ver }}'
          # 若上一步回写了版本号，要把 tag 打在回写后的那个提交上
          git fetch origin main
          target="$(git rev-parse origin/main)"
          # 排掉正要发的这个版本自己：补建半截 Release 时，最新的 tag 就是它，
          # 不排掉的话更新说明的区间变成 vX..vX，永远是空的
          prev_tag="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -vx "v$new_ver" | head -1)"
          # 更新说明：直接从提交主题生成——这样不管是 PR 合并（squash 后主题即 PR 标题）
          # 还是直接在网页改文件提交，都能列出来，不再出现空说明。过滤掉发版/校验和这类
          # 自动提交。取不到上一个 tag（首发）则退回 GitHub 自动生成。
          create() {
            if [ -n "$prev_tag" ]; then
              notes="$(git log --no-merges --pretty='- %s' "$prev_tag..$target" \
                       | grep -vE '^- (chore\(release\):|chore: auto-update SHA256SUMS)' || true)"
              [ -z "$notes" ] && notes="- 维护性更新"
              body="$(printf '## 更新内容\n\n%s\n\n**Full Changelog**: https://github.com/bgpeer/nodekit/compare/%s...v%s\n' \
                      "$notes" "$prev_tag" "$new_ver")"
              gh release create "v$new_ver" --target "$target" --title "v$new_ver" --notes "$body"
            else
              gh release create "v$new_ver" --target "$target" --title "v$new_ver" --generate-notes
            fi
          }

          # api.github.com 会偶发 5xx（这条流水线就被 502 打断过一次，留下了一个
          # 有 tag 没 Release 的版本）。重试几轮；每轮失败后先确认是不是其实已经
          # 建成了 —— 502 可能是在服务端建好之后才返回的。
          for i in 1 2 3 4 5; do
            if create; then
              echo "Release v$new_ver created."; exit 0
            fi
            if gh release view "v$new_ver" >/dev/null 2>&1; then
              echo "Release v$new_ver exists after all (server-side succeeded)."; exit 0
            fi
            echo "gh release create failed, retry=${i}"; sleep $((i * 5))
          done
          echo "Failed to create release after retries."; exit 1
