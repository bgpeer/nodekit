# metatube: true 会把 MetaTube 自动排到下面两行的【最前面】，
# 所以这里写的是"MetaTube 查不到时退回去用谁"。
- name: AV影片
  type: movies
  language: ja
  country: JP
  scrapers: TheMovieDb, TheTVDB
  image_scrapers: TheMovieDb, TheTVDB, FanArt
  metatube: true
  private: true
  keywords: av, 写真, 番号, AV影片

