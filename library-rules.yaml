# media-stack 媒体库关键词规则
#
# 「6 更新」和「4 生成媒体库」时会自动拉到机器上，改这里就行。
#
# 规则拿【文件夹名】去匹配 keywords，命中的文件夹整个收进对应的 Emby 媒体库，
# 不管它在哪个网盘、藏在第几层；命中之后不再往下钻。
#
#   name      媒体库在 Emby 里显示的名字
#   type      movies 电影 / tvshows 电视剧
#             tvshows 要求网盘里是「剧名/Season 01/剧名 - S01E01.mp4」结构
#   language  刮削语言 zh / ja / en，留空会按英文搜，中文片名搜不到
#   country   CN / JP / US，跟着 language 走
#   metatube  true 时额外挂上 MetaTube（按番号刮成人片），只给成人库开
#   scrapers  可选。这个库用哪些【元数据】刮削器，逗号隔开、按优先级排。
#             留空 = 用 Emby 的默认。写了就以这里为准，会覆盖 Emby 里的设置
#             电影：TheMovieDb, The Open Movie Database
#             剧集：TheTVDB, TheMovieDb
#   image_scrapers  同上，管【图像】（海报、背景图）
#             剧集常用：TheTVDB, FanArt, TheMovieDb
#   keywords  逗号隔开。【和文件夹名一模一样才算】，不是包含 ——
#             写「电影」不会命中「4K电影」，想收就把它也写进来。
#             只忽略首尾空白和大小写
#
# 只想改本机不动仓库：建 /opt/media-stack/library-rules.local.yaml，格式一样。

- name: 电影
  type: movies
  language: zh
  country: CN
  metatube: false
  keywords: 电影, movies, movie

- name: 电视剧
  type: tvshows
  language: zh
  country: CN
  metatube: false
  keywords: 电视剧, 剧集, 连续剧, tv

- name: 动漫
  type: tvshows
  language: zh
  country: CN
  scrapers: TheTVDB, TheMovieDb
  image_scrapers: TheTVDB, FanArt, TheMovieDb
  metatube: false
  keywords: 动漫, 动画, 番剧, anime

- name: 动漫电影
  type: movies
  language: zh
  country: CN
  metatube: false
  keywords: 动漫电影, 剧场版

- name: 纪录片
  type: movies
  language: zh
  country: CN
  metatube: false
  keywords: 纪录片, 纪录, documentary

- name: AV影片
  type: movies
  language: ja
  country: JP
  metatube: true
  keywords: av, 写真, 番号, AV影片
