# media-stack 媒体库关键词规则
#
# 「6 更新」和「4 生成媒体库」时会自动拉到机器上，改这里就行。
#
# 规则拿【文件夹名】去匹配 keywords，命中的文件夹整个收进对应的 Emby 媒体库，
# 不管它在哪个网盘、藏在第几层；命中之后不再往下钻。
#
#   name      媒体库在 Emby 里显示的名字
#   type      movies 电影 / tvshows 电视剧
#             tvshows 要求网盘里是「剧名/Season 01/剧名 - S01E01.mp4」结构
#   language  刮削语言。元数据和海报都用它，留空会按服务器默认（通常英文）搜，
#             中文片名一条都搜不到。想要「简体中文」而不是笼统的「中文」，
#             写 zh-CN；日语写 ja，英语 en
#   country   CN / JP / US，跟着 language 走
#   metatube  true 时额外挂上 MetaTube（按番号刮成人片），只给成人库开。
#             开了就自动排到 scrapers 名单【最前面】，不用在下面手写它
#   private   true = 这个库只有【管理员账号】能看见，其余账号一律看不到。
#             用途：电视上登一个非管理员账号，私密库在那台电视上根本不存在
#             （首页、搜索、继续观看里都不会出现）。
#             Emby 没有"给一个库设密码"这回事，它是按用户分权限的 ——
#             所以你得先在 Emby 里建第二个账号（设置 → 用户 → 添加），
#             建完跑一次「6 更新」，脚本会自动把这个库从它的可见范围里摘掉。
#             以后新加账号、新建库都会自动跟上，不用回去改勾
#   episode_number  只对 type: tvshows 有意义。
#             true = Emby 认错集号（或者没认出来）的那些剧集，在它的 strm 旁边
#             放一个只写季集编号的 .nfo，让 Emby 认对。
#             【文件名一个字不改，网盘也不动】—— 所以观看进度不会丢。
#             季固定写 1，集号用网盘文件名里那个完整的数：Emby 会把「231 4K」
#             的三位数读成【第 2 季第 31 集】，写死 S01E231 才对得上；
#             分几季由刮削器决定，脚本不管。
#             false = 这个库不补，并且把脚本写过的那种 .nfo 删掉
#             （网盘里本来就按季分好目录的库，写 false）。
#             不写这一行 = 脚本会在生成媒体库时问你一次。
#             【写了就一句都不问】，换机器、重装也不用再答
#   scrapers  这个库用哪些【元数据】刮削器，逗号隔开、【顺序就是优先级】——
#             排前面的先查、查到就赢，后面的只用来填空缺。
#             留空 = 用 Emby 的默认；写了就以这里为准，覆盖 Emby 里的设置。
#             【写了就是"只用这几个"】，没列进来的会被关掉，不是往上追加
#   image_scrapers  同上，管【图像】（海报、背景图、剧集缩略图）
#   keywords  逗号隔开。【和文件夹名一模一样才算】，不是包含 ——
#             写「电影」不会命中「4K电影」，想收就把它也写进来。
#             只忽略首尾空白和大小写
#
# 刮削器的排法按类型分，两套，别串：
#   电影 movies    TheMovieDb 打头 —— TheTVDB 的电影库薄得多
#   剧集 tvshows   TheTVDB   打头 —— 分季分集的信息它最全
# 两套都【不带 Image Capture】：那个是从视频里抓一帧当封面，而这里的片子都在
# 网盘上，抓一帧等于让 Emby 跨境把视频拉下来，几 MB 一个，片子多了就是几十 GB。
#
# 只想改本机不动仓库：建 /opt/media-stack/library-rules.local.yaml，格式一样。

- name: 电影
  type: movies
  language: zh-CN
  country: CN
  scrapers: TheMovieDb, TheTVDB
  image_scrapers: TheMovieDb, TheTVDB, FanArt
  metatube: false
  keywords: 电影, movies, movie

- name: 电视剧
  type: tvshows
  language: zh-CN
  country: CN
  scrapers: TheTVDB, TheMovieDb
  image_scrapers: TheTVDB, FanArt, TheMovieDb
  metatube: false
  episode_number: true
  keywords: 电视剧, 剧集, 连续剧, tv

- name: 动漫
  type: tvshows
  language: zh-CN
  country: CN
  scrapers: TheTVDB, TheMovieDb
  image_scrapers: TheTVDB, FanArt, TheMovieDb
  metatube: false
  episode_number: true
  keywords: 动漫, 动画, 番剧, anime

- name: 动漫剧场版
  type: movies
  language: zh-CN
  country: CN
  scrapers: TheMovieDb, TheTVDB
  image_scrapers: TheMovieDb, TheTVDB, FanArt
