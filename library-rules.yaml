# media-stack 媒体库关键词规则
#
# 这份文件在仓库里，「6 更新」时会自动拉到机器上。想改规则改这里就行，
# 不用登服务器 —— 手机上开 GitHub 直接编辑也可以。
#
# 改完之后：机器上跑一次「6 更新」，再进「3 后补参数 → 8」按 y。
#
# ---------------------------------------------------------------------------
# 它做什么
# ---------------------------------------------------------------------------
# 扫描生成的 strm 目录树是网盘目录树的镜像：
#
#     /data/strm/cloud/quark/电影/仙逆/仙逆 [第154集].strm
#                      └盘名┘ └────── 你网盘里的路径 ──────┘
#
# 这里的每条规则拿【文件夹名】去匹配关键词。命中的文件夹会被整个收进对应的
# Emby 媒体库 —— 不管它在哪个网盘、藏在第几层。多个盘里的「电影」文件夹会
# 合并进同一个「电影」库，这就是"整合"的意思。
#
# ---------------------------------------------------------------------------
# 四个字段
# ---------------------------------------------------------------------------
#   name      媒体库在 Emby 里显示的名字
#   type      movies（电影）或 tvshows（电视剧）
#             ⚠ 剧集用 movies 的话，每一集会变成一部独立电影，没有季集结构
#   metatube  true 时这个库启用 MetaTube（按番号刮成人片）
#             ⚠ 只给真的是成人片的库开。它会把动画认成 JAV —— 实测发生过
#   keywords  逗号隔开，大小写不敏感
#
# ---------------------------------------------------------------------------
# 关键词怎么写
# ---------------------------------------------------------------------------
#   · 中文按【子串】匹配 —— 写「电影」能命中「我的电影」「电影合集」「4K电影」
#   · 纯英文按【整词】匹配 —— 写 av 不会命中 Java、Savage、上海AVI
#     （不卡这一下的话，那些文件夹会被塞进成人库还自动开上 MetaTube）
#   · 命中后【不再往下钻】：/quark/电影/仙逆 命中「电影」之后，仙逆归它管，
#     不会再单独建一个库
#   · 从上往下【第一个命中的赢】，所以窄的关键词往前放
#
# ---------------------------------------------------------------------------
# 想收自己的文件夹
# ---------------------------------------------------------------------------
# 把文件夹名里的词加进去就行。比如网盘里那个文件夹叫「美女动作片」：
#
#     - name: AV影片
#       keywords: av, 写真, 番号, 美女动作片      ← 加在这儿
#
# ⚠ 别只加「动作片」—— 那会把成龙、甄子丹那些正经动作片也收进成人库、
#   还给它们开上 MetaTube。关键词越窄越安全。
#
# ---------------------------------------------------------------------------
# 不想动这份仓库文件的话
# ---------------------------------------------------------------------------
# 在机器上建 /opt/media-stack/library-rules.local.yaml，格式一样。
# 它存在时【完全覆盖】这份文件，而且「更新」不会碰它。
# 「3 后补参数 → 8」里的 a / d 改的也是那个本机文件。

- name: 电影
  type: movies
  metatube: false
  keywords: 电影, movies, movie

- name: 电视剧
  type: tvshows
  metatube: false
  keywords: 电视剧, 剧集, 连续剧, tv

- name: 动漫
  type: tvshows
  metatube: false
  keywords: 动漫, 动画, 番剧, anime

- name: 纪录片
  type: movies
  metatube: false
  keywords: 纪录片, 纪录, documentary

- name: AV影片
  type: movies
  metatube: true
  keywords: av, 写真, 番号
